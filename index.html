<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한국어 · 韓語單字卡</title>
  <meta name="theme-color" content="#4c6ef5">
  <meta name="description" content="韓文 ↔ 中文（繁體）雙向間隔重複學習">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="韓語單字卡">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">한국어 <span>· 單字卡</span></div>
    <div class="who">
      <span id="whoami"></span><span id="admin-tag" class="admin-tag hidden">管理員</span>
      <button id="btn-signout" class="link hidden">登出</button>
    </div>
  </header>

  <div class="wrap">
    <div id="msg"></div>

    <!-- ============ 登入 / 註冊 ============ -->
    <section id="view-auth" class="card hidden">
      <h2 id="auth-title" style="margin-top:0">登入</h2>
      <label>帳號名</label>
      <input id="f-email" type="text" autocomplete="username" placeholder="kuri">
      <label>密碼</label>
      <input id="f-pass" type="password" autocomplete="current-password" placeholder="密碼">
      <div id="row-name" class="hidden">
        <label>暱稱（選填）</label>
        <input id="f-name" type="text" placeholder="怎麼稱呼你">
      </div>
      <button id="btn-submit" class="primary" style="width:100%">登入</button>
      <p class="center" style="margin-bottom:0">
        <button id="btn-toggle" class="link">還沒有帳號？註冊</button>
      </p>
    </section>

    <!-- ============ 首頁 ============ -->
    <section id="view-home" class="hidden">
      <div class="card">
        <h2 style="margin-top:0">今日</h2>
        <div class="stats">
          <div><b id="s-due">–</b><small>待複習</small></div>
          <div><b id="s-done">–</b><small>今日已答</small></div>
          <div><b id="s-acc">–</b><small>今日正確率</small></div>
          <div><b id="s-all-acc">–</b><small>總正確率</small></div>
        </div>

        <div class="dir-pick" id="dir-pick">
          <label class="chip"><input type="radio" name="dir" value="ko2zh" checked><span>看韓文 → 想中文</span></label>
          <label class="chip"><input type="radio" name="dir" value="zh2ko"><span>看中文 → 想韓文</span></label>
        </div>

        <div class="mode-pick" id="mode-pick">
          <label class="chip"><input type="radio" name="mode" value="flip" checked><span>翻卡自評</span></label>
          <label class="chip"><input type="radio" name="mode" value="choice"><span>四選一</span></label>
        </div>

        <div class="row2" style="margin-top:14px">
          <button id="btn-review" class="primary">開始複習</button>
          <button id="btn-browse">瀏覽詞庫</button>
        </div>
      </div>

      <div class="card">
        <h2 style="margin-top:0">詞庫</h2>
        <div id="deck-list"><p class="muted">載入中…</p></div>
      </div>

      <div class="card">
        <h2 style="margin-top:0">近 30 天</h2>
        <div id="chart" class="chart"></div>
        <div id="chart-legend" class="muted center" style="margin-top:8px"></div>
      </div>

      <div class="card">
        <h2 style="margin-top:0">朗讀語音</h2>
        <div class="voice-row">
          <select id="voice-pick"></select>
          <button id="voice-test">試聽</button>
        </div>
        <div class="voice-row">
          <span class="muted" style="width:52px">語速</span>
          <input id="voice-rate" type="range" min="0.5" max="1.3" step="0.05">
          <span id="rate-label" class="muted" style="width:34px;text-align:right"></span>
        </div>
        <p class="muted" style="margin:8px 0 0">
          系統內建的趣味語音（Eddy、Grandma、Rocko…）聽起來機械，已自動濾除。
          最自然的是 Yuna；到「系統設定 → 輔助使用 → 朗讀內容 → 系統聲音」
          下載 Yuna 的「增強版」音質會再好一截。
        </p>
      </div>

      <div class="card" id="weak-card">
        <h2 style="margin-top:0">我的弱項</h2>
        <div id="weak-list"><p class="muted">答滿 3 次後才會出現統計。</p></div>
      </div>
    </section>

    <!-- ============ 學習中 ============ -->
    <section id="view-study" class="hidden">
      <div class="progress"><i id="prog" style="width:0%"></i></div>

      <div class="card study">
        <div class="dir-tag" id="c-dir"></div>
        <div class="type-tag" id="c-type"></div>

        <!-- 正面：依方向顯示韓文或中文 -->
        <div class="front" id="c-front"></div>
        <div class="roman hidden" id="c-roman"></div>

        <!-- 背面 -->
        <div id="c-back" class="hidden">
          <div class="divider"></div>
          <div class="back" id="c-back-text"></div>
          <div class="pos hidden" id="c-pos"></div>
          <div class="example hidden" id="c-example">
            <b id="c-ex-ko"></b><span id="c-ex-zh"></span>
          </div>
          <div class="note hidden" id="c-note"></div>
          <div class="acc muted hidden" id="c-acc"></div>
        </div>

        <div style="margin-top:14px">
          <button id="btn-speak" class="link">🔊 朗讀韓文</button>
          <button id="btn-edit-card" class="link hidden">✏️ 這條有錯</button>
        </div>
      </div>

      <div id="choices" class="choices hidden"></div>
      <button id="btn-show" class="primary" style="width:100%">顯示答案</button>
      <div id="grade" class="grade hidden">
        <button data-r="1"><span class="g1">忘了</span><small id="p1"></small></button>
        <button data-r="2"><span class="g2">有點難</span><small id="p2"></small></button>
        <button data-r="3"><span class="g3">記得</span><small id="p3"></small></button>
        <button data-r="4"><span class="g4">很簡單</span><small id="p4"></small></button>
      </div>
      <div class="nav-row">
        <button id="btn-prev">← 上一個</button>
        <span id="pos-label" class="muted"></span>
        <button id="btn-next">下一個 →</button>
      </div>
      <p class="center">
        <button id="btn-undo" class="link" disabled>↩︎ 撤銷上一題</button>
        <span class="muted"> · </span>
        <button id="btn-quit" class="link">結束本輪</button>
      </p>
    </section>

    <!-- ============ 瀏覽詞庫 ============ -->
    <section id="view-browse" class="hidden">
      <div class="card">
        <input id="b-search" type="search" placeholder="搜尋韓文／中文／羅馬音…" style="margin:0">
        <div id="b-tags" class="tag-row"></div>
      </div>
      <div class="card">
        <div class="browse-head">
          <span id="b-count" class="muted"></span>
          <button id="btn-study-tag" class="primary hidden" style="padding:6px 14px;font-size:13px">學這組</button>
        </div>
        <div id="b-list"></div>
      </div>
      <p class="center"><button id="btn-browse-back" class="link">← 返回</button></p>
    </section>

    <!-- ============ 本輪完成 ============ -->
    <section id="view-done" class="card center hidden">
      <h2 style="margin-top:0">🎉 本輪完成</h2>
      <p class="muted" id="done-text"></p>
      <button id="btn-back" class="primary">返回</button>
    </section>
  </div>

  <!-- ============ 編輯條目（管理員）============ -->
  <div id="editor" class="overlay hidden">
    <div class="editor-card">
      <div class="editor-head">
        <h2>編輯條目</h2>
        <button id="e-close" class="link">✕</button>
      </div>
      <div class="editor-body">
        <label>韓文 *</label>          <input id="e-ko" type="text">
        <label>中文（繁體）*</label>    <input id="e-zh" type="text">
        <div class="row2">
          <div><label>羅馬音</label><input id="e-roman" type="text"></div>
          <div><label>詞性</label><input id="e-pos" type="text" placeholder="명사 / 동사 …"></div>
        </div>
        <label>類型</label>
        <select id="e-type">
          <option value="word">單字</option>
          <option value="phrase">詞組</option>
          <option value="sentence">句子</option>
        </select>
        <label>例句（韓）</label>      <input id="e-ex-ko" type="text">
        <label>例句（中）</label>      <input id="e-ex-zh" type="text">
        <label>備註</label>            <input id="e-note" type="text">
        <label>標籤（逗號分隔）</label>  <input id="e-tags" type="text">
      </div>
      <div id="e-msg" class="editor-msg"></div>
      <div class="editor-foot">
        <button id="e-cancel">取消</button>
        <button id="e-save" class="primary">儲存並同步</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
